<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Aula Inter" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Aula Intercultural</title>
    <meta name="description" content="Recursos didácticos, dinámicas interactivas y material conceptual sobre Educación Intercultural para docentes de todas las etapas (Infantil, Primaria, Secundaria)." />
    <meta property="og:title" content="Aula Intercultural" />
    <meta property="og:description" content="Recursos didácticos, dinámicas interactivas y material conceptual sobre Educación Intercultural para docentes de todas las etapas (Infantil, Primaria, Secundaria)." />
    <script>
      // Mock WebSocket so @vite/client in Cloud Run never attempts failing WSS upgrades
      (function() {
        if (typeof window !== 'undefined') {
          function FakeWebSocket(url, protocols) {
            this.url = url || '';
            this.protocols = protocols;
            this.readyState = 1; // Always OPEN immediately
            this.OPEN = 1;
            this.CONNECTING = 0;
            this.CLOSING = 2;
            this.CLOSED = 3;
            this.bufferedAmount = 0;
            this.binaryType = 'blob';
            this.extensions = '';
            this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || '');
            this.listeners = {};

            var self = this;
            setTimeout(function() {
              if (self.onopen) {
                try { self.onopen({ type: 'open', target: self }); } catch(e) {}
              }
              if (self.listeners['open']) {
                self.listeners['open'].forEach(function(cb) {
                  try { cb({ type: 'open', target: self }); } catch(e) {}
                });
              }
            }, 0);
          }

          FakeWebSocket.OPEN = 1;
          FakeWebSocket.CONNECTING = 0;
          FakeWebSocket.CLOSING = 2;
          FakeWebSocket.CLOSED = 3;

          FakeWebSocket.prototype.OPEN = 1;
          FakeWebSocket.prototype.CONNECTING = 0;
          FakeWebSocket.prototype.CLOSING = 2;
          FakeWebSocket.prototype.CLOSED = 3;

          FakeWebSocket.prototype.addEventListener = function(event, callback) {
            if (!this.listeners) this.listeners = {};
            if (!this.listeners[event]) this.listeners[event] = [];
            this.listeners[event].push(callback);
            if (event === 'open' && this.readyState === 1) {
              var self = this;
              setTimeout(function() {
                try { callback({ type: 'open', target: self }); } catch(e) {}
              }, 0);
            }
          };

          FakeWebSocket.prototype.removeEventListener = function(event, callback) {
            if (!this.listeners || !this.listeners[event]) return;
            this.listeners[event] = this.listeners[event].filter(function(cb) { return cb !== callback; });
          };

          FakeWebSocket.prototype.dispatchEvent = function() { return true; };
          FakeWebSocket.prototype.send = function() {};
          FakeWebSocket.prototype.close = function() {
            this.readyState = 3;
          };

          window.WebSocket = FakeWebSocket;

          var origConsoleError = console.error;
          var origConsoleWarn = console.warn;

          function isViteWsError(args) {
            for (var i = 0; i < args.length; i++) {
              var str = String(args[i] && (args[i].message || args[i].stack || args[i]) || '');
              if (
                str.indexOf('WebSocket closed without opened') !== -1 ||
                str.indexOf('failed to connect to websocket') !== -1 ||
                str.indexOf('vite:ws') !== -1 ||
                (str.indexOf('[vite]') !== -1 && str.indexOf('websocket') !== -1)
              ) {
                return true;
              }
            }
            return false;
          }

          console.error = function() {
            if (isViteWsError(arguments)) return;
            return origConsoleError.apply(console, arguments);
          };

          console.warn = function() {
            if (isViteWsError(arguments)) return;
            return origConsoleWarn.apply(console, arguments);
          };

          window.addEventListener('error', function (e) {
            var msg = (e && (e.message || (e.error && e.error.message))) || '';
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function (e) {
            var reasonStr = (e && e.reason) ? String(e.reason.message || e.reason.stack || e.reason) : '';
            if (reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('[vite]') !== -1) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          }, true);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
